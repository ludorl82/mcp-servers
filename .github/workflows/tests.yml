name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Tests hors ligne
        run: python3 -m unittest discover -s tests -v
      - name: Bases Kustomize
        run: for d in hockey meteo articles web; do kubectl kustomize "$d" > /dev/null; done
