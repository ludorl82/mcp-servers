# web : lire une page web. CE SERVEUR EST UN PROXY : ne lui donnez jamais
# d'adresse publique sans authentification devant. Il refuse lui-même les
# adresses qui ne sont pas sur Internet ; networkpolicy.yaml fait la même
# chose une deuxième fois, dans le réseau du cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-mcp
  template:
    metadata:
      labels:
        app: web-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: python:3.14.8-alpine3.24
          command: ["python3", "-I", "/app/server.py"]
          env:
            - name: PORT
              value: "8080"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: server
              mountPath: /app
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: server
          configMap:
            name: web-mcp-server
---
apiVersion: v1
kind: Service
metadata:
  name: web-mcp
spec:
  selector:
    app: web-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
